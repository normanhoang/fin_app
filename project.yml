name: FinApp
options:
  bundleIdPrefix: com.normanhoang
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "DZRPJF9JB6"
    CODE_SIGN_STYLE: Automatic

targets:
  FinApp:
    type: application
    platform: iOS
    sources:
      - path: Sources/FinApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.normanhoang.finapp
        CODE_SIGN_ENTITLEMENTS: FinApp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Unlock FinApp to view your financial data."
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.finance"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  FinAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/FinAppTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.normanhoang.finapp.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: FinApp

  FinAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/FinAppUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.normanhoang.finapp.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: FinApp

schemes:
  FinApp:
    build:
      targets:
        FinApp: all
        FinAppTests: [test]
        FinAppUITests: [test]
    test:
      targets:
        - FinAppTests
        - FinAppUITests
